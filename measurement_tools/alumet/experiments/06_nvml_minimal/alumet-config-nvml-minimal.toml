# CSV Output Plugin
[plugins.csv]
output_path = "alumet-output-nvml-minimal.csv"
force_flush = true
append_unit_to_metric_name = true
use_unit_display_name = true
csv_delimiter = ";"
csv_late_delimiter = ","

# Procfs Plugin
[plugins.procfs.kernel]
enabled = true
poll_interval = "100ms"

[plugins.procfs.memory]
enabled = true
poll_interval = "100ms"
metrics = [
    "MemTotal",
    "MemFree",
    "MemAvailable",
    "Cached",
    "SwapCached",
    "Active",
    "Inactive",
    "Mapped",
]

[plugins.procfs.network]
enabled = false
poll_interval = "100ms"

[plugins.procfs.processes]
enabled = true
refresh_interval = "100ms"
strategy = "event"

# Process groups (used when strategy = "watcher", but must be present).
# Omit pid, ppid, and exe_regex to match all processes.
[[plugins.procfs.processes.groups]]
exe_regex = ""
poll_interval = "100ms"
flush_interval = "1s"
memory_mode = "quick"    # "quick" reads /proc/<pid>/statm (fast)
                         # "slow_but_accurate" reads /proc/<pid>/smaps_rollup (precise)

# Event-mode settings (used when strategy = "event").
[plugins.procfs.processes.events]
poll_interval = "100ms"
flush_interval = "1s"
memory_mode = "quick"

# RAPL Plugin (CPU energy)
[plugins.rapl]
poll_interval = "100ms"
flush_interval = "1s"
no_perf_events = false

# Perf Plugin (hardware/software counters)
[plugins.perf]
poll_interval = "100ms"
flush_interval = "1s"
hardware_events = [
    "CPU_CYCLES",
    "INSTRUCTIONS",
    "CACHE_REFERENCES",
    "CACHE_MISSES",
    "BRANCH_INSTRUCTIONS",
    "BRANCH_MISSES",
    "BUS_CYCLES",
    "REF_CPU_CYCLES",
]
software_events = [
    "PAGE_FAULTS",
    "CONTEXT_SWITCHES",
    "CPU_MIGRATIONS",
    "PAGE_FAULTS_MIN",
    "PAGE_FAULTS_MAJ",
    "ALIGNMENT_FAULTS",
    "EMULATION_FAULTS",
    "CGROUP_SWITCHES",
]
cache_events = []

# NVML Plugin
[plugins.nvml]
poll_interval = "100ms"
flush_interval = "1s"
skip_failed_devices = true
mode = "minimal"         # "full" for all GPU metrics, "minimal" for power only