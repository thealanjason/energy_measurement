# CSV Output Plugin
[plugins.csv]
output_path = "alumet-output-nvml-full.csv"
force_flush = true
append_unit_to_metric_name = true
use_unit_display_name = true
csv_delimiter = ";"
csv_late_delimiter = ","

# Procfs Plugin
[plugins.procfs.kernel]
enabled = true
poll_interval = "500ms"

[plugins.procfs.memory]
enabled = true
poll_interval = "500ms"
metrics = [
    "MemTotal",
    "MemFree",
    "MemAvailable",
    "Cached",
    "SwapCached",
    "Active",
    "Inactive",
    "Mapped",
]

[plugins.procfs.processes]
enabled = true
refresh_interval = "500ms"
strategy = "event" # "event" for polling, "watcher" for watching for process changes

# Process groups (used when strategy = "watcher", but must be present).
# Omit pid, ppid, and exe_regex to match all processes.
[[plugins.procfs.processes.groups]]
exe_regex = "python.*"  # Only track python processes
poll_interval = "500ms"
flush_interval = "1s"

# Event-mode settings (used when strategy = "event").
[plugins.procfs.processes.events]
poll_interval = "500ms"
flush_interval = "1s"

# RAPL Plugin (CPU energy)
[plugins.rapl]
poll_interval = "500ms"
flush_interval = "1s"
no_perf_events = false

# Perf Plugin (hardware/software counters)
[plugins.perf]
poll_interval = "500ms"
flush_interval = "1s"
hardware_events = [
    "CPU_CYCLES",
    "INSTRUCTIONS",
    "CACHE_REFERENCES",
    "CACHE_MISSES",
    "BRANCH_INSTRUCTIONS",
    "BRANCH_MISSES",
    "BUS_CYCLES",
    "REF_CPU_CYCLES",
]
software_events = [
    "PAGE_FAULTS",
    "CONTEXT_SWITCHES",
    "CPU_MIGRATIONS",
    "PAGE_FAULTS_MIN",
    "PAGE_FAULTS_MAJ",
    "ALIGNMENT_FAULTS",
    "EMULATION_FAULTS",
    "CGROUP_SWITCHES",
]
cache_events = []

# NVML Plugin
[plugins.nvml]
# https://github.com/alumet-dev/alumet/tree/main/plugins/nvidia-nvml
# NVML requires 20-100ms to refresh counter values based on GPU model. 
# When poll_interval is set too low, the plugin queries identical counter values repeatedly during polling. 
# Since some measurements are calculated from previous polls, these measurements are discarded rather than reported as zero values.
poll_interval = "500ms"
flush_interval = "1s"
skip_failed_devices = true

# Energy Attribution Plugin
[plugins.energy-attribution]
enabled = true

[plugins.energy-attribution.formulas.attributed_energy_cpu]
# the expression used to compute the final value
expr = "cpu_energy * cpu_usage / 100.0"
# the time reference: this is a timeseries, defined by a metric (and other criteria, see below), that will not change during the transformation. Other timeseries can be interpolated in order to have the same timestamps before applying the formula.
ref = "cpu_energy"
# retention time is the time period over which the formula is applied
# it should be coherent with the input metrics’ poll_interval, and give the example that if inputs are polled every 1 second, using at least 2 seconds is recommended so previous values are available for interpolation.
# https://github.com/alumet-dev/alumet/pull/328/changes
retention_time = "1s"

# Timeseries related to the resources.
[plugins.energy-attribution.formulas.attributed_energy_cpu.per_resource]
# Defines the timeseries `cpu_energy` that is used in the formula, as the measurement points that have:
# - the metric `rapl_consumed_energy`,
# - and the resource kind `"local_machine"`
# - and the attribute `domain` equal to `package_total`
cpu_energy = { metric = "rapl_consumed_energy", resource_kind = "local_machine", domain = "package_total" }

# Timeseries related to the resource consumers.
[plugins.energy-attribution.formulas.attributed_energy_cpu.per_consumer]
# Defines the timeseries `cpu_usage` that is used in the formula, as the measurements points that have:
# - the metric `cpu_percent`
# - the attribute `kind` equal to `total`
cpu_usage = { metric = "cpu_percent", kind = "total" }

[plugins.energy-attribution.formulas.attributed_energy_gpu]
expr = "gpu_energy * gpu_usage / 100.0 / 1000.0"
ref = "gpu_energy"
retention_time = "1s"

[plugins.energy-attribution.formulas.attributed_energy_gpu.per_resource]
gpu_energy = { metric = "nvml_energy_consumption" }

[plugins.energy-attribution.formulas.attributed_energy_gpu.per_consumer]
gpu_usage = { metric = "nvml_sm_utilization" }